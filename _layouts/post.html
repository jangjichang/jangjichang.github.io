---
layout: default
---

<article>
  <h1>{{ page.title }}</h1>
  <p class="post-meta">
    <time datetime="{{ page.date | date_to_xmlschema }}">{{ page.date | date: site.theme_config.date_format }}</time>
  </p>
  {{ content }}
  {% include post_footer.html %}
</article>

<a class="back-home" href="{{ '/' | relative_url }}">← 홈으로</a>
