{% if page.tags and page.tags.size > 0 %}
<footer class="post-tags">
  <p class="eyebrow">RELATED INDEX</p>
  <div>
    {% for tag in page.tags %}
      {%- assign tag_slug = tag | slugify -%}
      <a href="{{ '/tags/' | append: tag_slug | append: '/' | relative_url }}" class="tag">#{{ tag }}</a>
    {% endfor %}
  </div>
</footer>
{% endif %}
